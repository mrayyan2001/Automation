<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{ title }}</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: #10151c;
        color: #edf2f7;
        font-family: system-ui, sans-serif;
      }
      main { width: min(100%, 680px); }
      .brand { color: #89a5bb; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 24px 0 16px; font-size: clamp(40px, 8vw, 68px); line-height: 1.08; letter-spacing: -.04em; }
      p { color: #a6b5c4; font-size: 18px; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      a { padding: 13px 20px; border: 1px solid #344556; border-radius: 8px; color: #edf2f7; text-decoration: none; }
      a.primary { background: #b4edcf; border-color: #b4edcf; color: #10251b; }
      a:hover { filter: brightness(1.15); }
      a:focus-visible { outline: 3px solid #8abfff; outline-offset: 4px; }
      footer { margin-top: 64px; color: #73879a; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Automation</div>
      <h1>Your automation<br>starts here.</h1>
      <p>Explore the API, try an endpoint, and build your next workflow.</p>
      {% if tags %}
      <ul aria-label="Tags">
        {% for tag in tags %}
        <li>{{ tag }}</li>
        {% endfor %}
      </ul>
      {% endif %}
      <nav aria-label="API resources">
        <a class="primary" href="/docs">Explore the API &rarr;</a>
        <a href="/redoc">API reference</a>
        <a href="/openapi.json">OpenAPI schema</a>
      </nav>
      <footer>Automation &middot; Developer workspace</footer>
    </main>
  </body>
</html>
