HTTP_SERVER:
  HOST: ${HTTP_SERVER_HOST:-localhost}
  PORT: ${HTTP_SERVER_PORT:-80}
  RELOAD: false
SMTP_EMAIL:
  HOST: ${SMTP_HOST:-smtp.gmail.com}
  PORT: ${SMTP_PORT:-587}
  USERNAME: ${SMTP_USERNAME:-}
  PASSWORD: ${SMTP_PASSWORD:-}
  SENDER: ${SMTP_SENDER:-no-reply@localhost}
  STARTTLS: ${SMTP_STARTTLS:-true}
  TIMEOUT: ${SMTP_TIMEOUT:-10}
