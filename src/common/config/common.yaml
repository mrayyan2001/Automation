HTTP_SERVER:
  HOST: ${HTTP_SERVER_HOST:-localhost}
  PORT: ${HTTP_SERVER_PORT:-80}
  RELOAD: false

SMTP_EMAIL:
  HOST: ${SMTP_HOST:-smtp.gmail.com}
  PORT: ${SMTP_PORT:-587}
  USERNAME: ${SMTP_USERNAME:-}
  PASSWORD: ${SMTP_PASSWORD:-}
  SENDER: ${SMTP_SENDER:-no-reply@localhost}
  STARTTLS: ${SMTP_STARTTLS:-true}
  TIMEOUT: ${SMTP_TIMEOUT:-10}

REDIS:
  HOST: ${REDIS_HOST:-localhost}
  PORT: ${REDIS_PORT:-6379}
  DB: ${REDIS_DB:-0}
  PASSWORD: ${REDIS_PASSWORD:-}
  MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
  CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-5}
  SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
