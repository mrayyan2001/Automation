HTTP_SERVER:
  HOST: ${HTTP_SERVER_HOST:-localhost}
  PORT: ${HTTP_SERVER_PORT:-80}
  RELOAD: false

SMTP_EMAIL:
  HOST: ${SMTP_HOST:-smtp.gmail.com}
  PORT: ${SMTP_PORT:-587}
  USERNAME: ${SMTP_USERNAME:-}
  PASSWORD: ${SMTP_PASSWORD:-}
  SENDER: ${SMTP_SENDER:-no-reply@localhost}
  STARTTLS: ${SMTP_STARTTLS:-true}
  TIMEOUT: ${SMTP_TIMEOUT:-10}

REDIS:
  HOST: ${REDIS_HOST:-localhost}
  PORT: ${REDIS_PORT:-6379}
  DB: ${REDIS_DB:-0}
  PASSWORD: ${REDIS_PASSWORD:-}
  MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
  CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-5}
  SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}

CITUS:
  HOST: ${CITUS_HOST:-localhost}
  PORT: ${CITUS_PORT:-5432}
  USER: ${CITUS_USER:-postgres}
  PASSWORD: ${CITUS_PASSWORD:-automation}
  DATABASE: ${CITUS_DATABASE:-postgres}
  CONNECT_TIMEOUT_SECONDS: ${CITUS_CONNECT_TIMEOUT_SECONDS:-5}
  MIN_CONNECTIONS: ${CITUS_MIN_CONNECTIONS:-1}
  MAX_CONNECTIONS: ${CITUS_MAX_CONNECTIONS:-10}

OTP:
  IS_DEV: false
  TTL_SECONDS: 300
  MAX_RETRY: 5
  ONLY_DIGITS: false
  LENGTH: 3
  CONFIRM_TTL_SECONDS: 300
  CONFIRM_USAGE: 1
  SUBJECT: "Your Verification Code"
  BODY: "Your verification code for {purpose} is {otp}."
